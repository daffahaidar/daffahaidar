name: Generate Profile Assets

on:
  schedule:
    - cron: "0 0 * * *" # every day at 00:00 UTC
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#1e40af&color_dots=#ebedf0,#bfdbfe,#60a5fa,#2563eb,#0a192f
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#57a6ff&color_dots=#112240,#1e3a8a,#1d4ed8,#3b82f6,#93c5fd

      - name: Generate trophy SVG
        # pinned to a commit: this third-party action receives the token
        uses: ryo-ma/github-profile-trophy@43736b50a82fca73c8df1c81abb40aa03519975c
        with:
          username: ${{ github.repository_owner }}
          output_path: dist/trophy.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          theme: algolia

      - name: Recolor trophy to the navy palette
        run: sed -i -e 's/#050f2c/#0a192f/g' -e 's/#00aeff/#57a6ff/g' dist/trophy.svg

      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
